<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>我的书房</title>
<link rel="stylesheet" href="renderer/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b5e3c" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>
    我的书房
  </div>
  <input id="globalSearch" class="gsearch" placeholder="一次搜遍所有书，回车直接问（全库模式）…">
  <div id="modelChip" class="chip">模型加载中…</div>
</header>
<nav class="sidebar">
  <button class="navbtn active" data-view="shelf">书架</button>
  <button class="navbtn" data-view="reader">翻书</button>
  <button class="navbtn" data-view="ask">问一问</button>
  <button class="navbtn" data-view="chat">对话</button>
  <button class="navbtn" data-view="skills">技能开关</button>
  <div class="side-foot" id="sideFoot"></div>
</nav>
<main class="main" id="main"></main>
<div id="toast" class="toast hidden"></div>
<div id="wizard" class="wizard hidden"></div>
<script type="module" src="renderer/app.js"></script>
</body>
</html>
